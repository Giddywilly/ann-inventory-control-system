{% extends 'base.html' %}{% block title %}{{ 'Edit Item' if item else 'Register Item' }}{% endblock %}{% block content %}
<section class="panel"><h2>{{ 'Edit ' ~ item.item_name if item else 'Register a new inventory item' }}</h2>
<form class="f" method="post">
 <div class="fld"><label>Item ID</label><input name="item_id" required value="{{ item.item_id if item }}" {{ 'readonly' if item }}></div>
 <div class="fld"><label>Item name</label><input name="item_name" required value="{{ item.item_name if item }}"></div>
 <div class="fld"><label>Category</label><select name="category">{% for c in categories %}<option {{ 'selected' if item and item.category==c }}>{{ c }}</option>{% endfor %}</select></div>
 <div class="fld"><label>Supplier</label><select name="supplier_id">{% for s in suppliers %}<option value="{{ s.supplier_id }}" {{ 'selected' if item and item.supplier_id==s.supplier_id }}>{{ s.supplier_name }}</option>{% endfor %}</select></div>
 <div class="fld"><label>Unit cost (₦)</label><input name="unit_cost" type="number" step="0.01" min="0" required value="{{ item.unit_cost if item }}"></div>
 <div class="fld"><label>Static reorder level</label><input name="reorder_level" type="number" min="0" required value="{{ item.reorder_level if item }}"></div>
 <div class="actions"><button class="btn primary">{{ 'Save Changes' if item else 'Register Item' }}</button><a class="btn" href="{{ url_for('items') }}">Cancel</a></div>
</form></section>{% endblock %}
